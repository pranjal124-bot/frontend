<!DOCTYPE html>
<html>
<head>
    <title>Nested Table</title>
    <style>
        table {
            border-collapse: collapse;
            width: 80%;
            margin: 20px auto;
        }

        th, td {
            border: 2px solid black;
            padding: 12px;
            text-align: left;
        }

        th {
            text-align: center;
        }
    </style>
</head>

<body>

<table>
    <tr>
        <th>Level1</th>
        <th>Level2</th>
        <th>Level3</th>
        <th>Info</th>
        <th>Name</th>
    </tr>

    <tr>
        <td rowspan="5">System</td>
        <td rowspan="3">System Apps</td>
        <td rowspan="2">SystemEnv</td>
        <td>App Test</td>
        <td>foo</td>
    </tr>

    <tr>
        <td>App Memory</td>
        <td>foo</td>
    </tr>

    <tr>
        <td>SystemEnv2</td>
        <td>App Test</td>
        <td>bar</td>
    </tr>

    <tr>
        <td rowspan="2">System Memory</td>
        <td rowspan="2">Memory Test</td>
        <td>Memory Func</td>
        <td>foo</td>
    </tr>

    <tr>
        <td>Apes Test</td>
        <td>foo</td>
    </tr>
</table>

</body>
</html>
