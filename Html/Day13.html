<!DOCTYPE html>
<html>
<head>
    <title> Schedule</title>

    <style>
        table {
            border-collapse: collapse;
            width: 90%;
            margin: 20px auto;
        }

        th, td {
            border: 2px solid black;
            padding: 15px;
            text-align: center;
        }

        th {
            font-weight: bold;
        }

        .yellow {
            background-color: #fff9a6;
        }

        .green {
            background-color: #a8f0a8;
        }

        .blue {
            background-color: #b8b8f5;
        }
    </style>
</head>

<body>

<table>

    <tr>
        <th rowspan="3">Day</th>
        <th colspan="3">Seminar</th>
    </tr>

    <tr>
        <th colspan="2">Schedule</th>
        <th rowspan="2">Topic</th>
    </tr>

    <tr>
        <th>Begin</th>
        <th>End</th>
    </tr>

    <tr>
        <td rowspan="2">Monday</td>
        <td class="yellow">8:00 a.m.</td>
        <td class="blue">5:00 p.m.</td>
        <td>Introduction to XML</td>
    </tr>

    <tr>
        <td class="yellow"></td>
        <td class="blue"></td>
        <td>Validity: DTD and Relax NG</td>
    </tr>

    <tr>
        <td rowspan="3">Tuesday</td>
        <td class="yellow">8:00 a.m.</td>
        <td class="yellow">11:00 a.m.</td>
        <td rowspan="2">XPath</td>
    </tr>

    <tr>
        <td class="yellow">11:00 a.m.</td>
        <td class="green">2:00 p.m.</td>
    </tr>

    <tr>
        <td class="green">2:00 p.m.</td>
        <td class="blue">5:00 p.m.</td>
        <td>XSL Transformations</td>
    </tr>

    <tr>
        <td>Wednesday</td>
        <td class="yellow">8:00 a.m.</td>
        <td class="green">12:00 p.m.</td>
        <td>XSL Formatting Objects</td>
    </tr>

</table>

</body>
</html>
