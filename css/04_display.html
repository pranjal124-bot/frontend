<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="04_disply.css">
</head>
<body>

    <h2>Body Display</h2>
    <div class="div-block">
        <h3 class="block">Hii</h3>
        <h3 class="block">Hello</h3>
        <h3 class="block">Welcome </h3>
    </div>

    <h2>Inline Display</h2>
    <div class="div-block">
        <h3 class="inline">Hii</h3>
        <h3 class="inline">Hello</h3>
        <h3 class="inline">Welcome</h3>
    </div>
    
    <h2>Inline-Block Display</h2>
    <div class="div-block">
    <h3 class="inline-block">Hii</h3>
    <h3 class="inline-block">Hello</h3>
    <h3 class="inline-block">Welcome</h3>
    </div>
</body>
</html>
